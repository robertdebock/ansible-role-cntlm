---
# tasks file for cntlm

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install requirements
  ansible.builtin.package:
    name: "{{ cntlm_requirements }}"
    state: present

- name: Include local IP in cntlm_allows
  ansible.builtin.set_fact:
    cntlm_allows: "{{ cntlm_allows + [hostvars[inventory_hostname]['ansible_facts']['default_ipv4']['address'] + '/32'] }}"
  when:
    - cntlm_allows_include_local_ipv4

- name: Unpack cntlm software
  ansible.builtin.unarchive:
    src: "{{ cntlm_sourceforge_mirror }}/{{ cntlm_archive }}"
    dest: "{{ cntlm_tmp }}"
    remote_src: true
    mode: "0755"
  when:
    - ansible_facts['pkg_mgr'] not in [ "apt", "yum", "dnf", "dnf5" ]
  notify:
    - Configure cntlm
    - Make cntlm
    - Install cntlm

# All supported distributions package cntlm (EL through EPEL), SourceForge mirrors come and go.
- name: Install cntlm software
  ansible.builtin.package:
    name: cntlm
    state: present
  when:
    - ansible_facts['pkg_mgr'] in [ "apt", "yum", "dnf", "dnf5" ]

- name: Create cntlm service
  ansible.builtin.import_role:
    name: robertdebock.service
  vars:
    service_list:
      - name: cntlm
        description: Start CNTLM
        start_command: /usr/sbin/cntlm -c /etc/cntlm.conf -f
        status_pattern: cntlm

- name: Generate hash
  ansible.builtin.shell:
    cmd: "set -o pipefail && {{ cntlm_hash_command }} | tee /etc/cntlm.hash"
    creates: /etc/cntlm.hash
    executable: /bin/bash
  register: cntlm_generate_hash
  check_mode: false
  notify:
    - Configure cntlm.conf
  when:
    - cntlm_passntlmv2 is not defined

- name: Start and enable cntlm
  ansible.builtin.service:
    name: cntlm
    state: started
    enabled: true
